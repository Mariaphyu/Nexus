<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maria Phyu | Digital Profile</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://jsdelivr.net"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4 antialiased">

    <!-- Card Container -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100 transform transition-all duration-300">
        
        <!-- Header Banner Accent -->
        <div class="h-24 bg-gradient-to-r bg-emerald-600 to-teal-500"></div>

        <!-- Profile Content -->
        <div class="px-6 pb-8 pt-0 relative flex flex-col items-center">
            
            <!-- Avatar Placeholder (Initials) -->
            <div class="w-24 h-24 bg-teal-100 border-4 border-white text-teal-700 rounded-full flex items-center justify-center text-3xl font-bold shadow-md -mt-12 mb-4">
                MP
            </div>

            <!-- Name & Title -->
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Maria Phyu</h1>
            <p class="text-emerald-600 font-semibold text-sm tracking-wide uppercase mt-1">Food Safety Auditor</p>
            
            <!-- Short Professional Bio -->
            <p class="text-slate-500 text-center text-sm mt-3 px-2 leading-relaxed">
                Ensuring compliance, quality, and consumer trust through rigorous standards auditing and food safety systems expertise.
            </p>

            <!-- Action Button: Save Contact -->
            <a href="contact.vcf" download class="w-full mt-6 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 px-4 rounded-xl shadow-md shadow-emerald-200 transition-all duration-200 flex items-center justify-center gap-2 group">
                <i class="fa-solid fa-user-plus group-hover:scale-110 transition-transform"></i>
                Save Contact to Phone
            </a>

            <!-- Divider -->
            <div class="w-full border-t border-slate-100 my-6"></div>

            <!-- Social Links Stack -->
            <div class="w-full space-y-3">
                
                <!-- LinkedIn Link -->
                <a href="https://www.linkedin.com/in/mariaphyu/" target="_blank" rel="noopener noreferrer" class="w-full bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 font-medium py-3 px-4 rounded-xl transition-colors duration-200 flex items-center justify-between group">
                    <div class="flex items-center gap-3">
                        <i class="fa-brands fa-linkedin text-blue-600 text-xl"></i>
                        <span>Connect on LinkedIn</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-400 group-hover:translate-x-1 transition-transform text-xs"></i>
                </a>

                <!-- Placeholder Website Link (Feel free to update this URL or remove it if not needed) -->
                <a href="#" target="_blank" rel="noopener noreferrer" class="w-full bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 font-medium py-3 px-4 rounded-xl transition-colors duration-200 flex items-center justify-between group">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-globe text-teal-600 text-xl"></i>
                        <span>Professional Website</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-400 group-hover:translate-x-1 transition-transform text-xs"></i>
                </a>

            </div>
        </div>

        <!-- Footer Footer Design Sign-off -->
        <div class="bg-slate-50 py-3 text-center border-t border-slate-100">
            <p class="text-xs text-slate-400">Scan QR to view digital business card</p>
        </div>
    </div>

</body>
</html>
